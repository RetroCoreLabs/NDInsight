name: Docs site on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs-site/requirements.txt
      # TODO(docs-site): switch back to `mkdocs build --strict` once the broken links
      # are fixed (see "Docs site" in CONTRIBUTING.md). Until then the build is not
      # strict, and the warnings are summarised on the run page instead.
      - name: Build site
        run: |
          mkdocs build -f docs-site/mkdocs.yml -d "${{ runner.temp }}/site" 2>&1 | tee "${{ runner.temp }}/build.log"
      - name: Summarise link warnings
        run: |
          {
            echo "### Docs build warnings"
            echo "Total: $(grep -c '^WARNING' "${{ runner.temp }}/build.log" || true)"
            echo "- missing target: $(grep '^WARNING' "${{ runner.temp }}/build.log" | grep -c 'is not found among' || true)"
            echo "- unrecognized relative link: $(grep '^WARNING' "${{ runner.temp }}/build.log" | grep -c 'unrecognized relative link' || true)"
            echo "- absolute link: $(grep '^WARNING' "${{ runner.temp }}/build.log" | grep -c 'absolute link' || true)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
